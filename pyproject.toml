[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpilot"
version = "3.1.0-pilot"
description = "High-performance, 100% offline universal voice dictation assistant for Windows"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "FlowPilot Contributors" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Desktop Environment",
]
dependencies = [
    "PySide6>=6.5.0",
    "faster-whisper>=1.0.0",
    "onnxruntime>=1.16.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.2.0; sys_platform == 'win32'",
    "pyperclip>=1.8.2",
    "psutil>=5.9.0",
    "pynput>=1.7.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pyinstaller>=6.0.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
]

[project.scripts]
flowpilot = "desktop_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "ui*"]
