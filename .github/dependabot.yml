version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "actions"
      - "security"
